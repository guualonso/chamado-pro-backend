# ============================================================
# Banco de dados
# Credenciais NUNCA devem ser versionadas: informe via variáveis
# de ambiente (veja .env.example).
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chamado-pro}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Não loga SQL em produção (pode expor dados pessoais nos logs)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# Erros: nunca expor mensagens internas ou stack traces ao cliente
# ============================================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
# Respeita X-Forwarded-* enviados pelo ALB/NGINX (IP real e HTTPS)
server.forward-headers-strategy=native

# ============================================================
# JWT
# O segredo deve ter pelo menos 32 bytes e vir de variável de ambiente.
# Gere um com: openssl rand -base64 48
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ============================================================
# Criptografia de dados sensíveis em repouso (ex.: API Key do WhatsApp).
# Chave AES de 256 bits em Base64. Gere com: openssl rand -base64 32
# ============================================================
app.security.encryption-key=${APP_ENCRYPTION_KEY}

# Proteção contra força bruta no login
app.security.login.max-tentativas=5
app.security.login.bloqueio-minutos=15

# Origens permitidas para CORS (separadas por vírgula). Vazio = CORS desabilitado,
# que é o caso quando o frontend é servido pelo mesmo domínio via proxy NGINX.
app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Usuário administrador inicial. Se ADMIN_DEFAULT_PASSWORD não for informado,
# uma senha aleatória é gerada e exibida uma única vez no log de inicialização.
app.admin.email=${ADMIN_EMAIL:admin@chamado.com}
app.admin.senha=${ADMIN_DEFAULT_PASSWORD:}

# Versão vigente dos Termos de Uso / Política de Privacidade.
# Ao alterar, todos os usuários precisam aceitar novamente no próximo acesso.
# Deve ser igual a LEGAL_VERSION no frontend (src/app/shared/business-info.ts).
app.legal.versao-termos=2026-10-21

# ============================================================
# WhatsApp (CallMeBot) - notificações via WhatsApp.
# Só é enviado para usuários que deram consentimento explícito
# (opt-in) na tela de consentimento. Cada usuário deve:
#  1) Adicionar o contato +34 644 84 71 64 no WhatsApp
#  2) Enviar a mensagem "I allow callmebot to send me messages"
#  3) Cadastrar o telefone e a API Key recebida no perfil do usuário
# ============================================================
whatsapp.callmebot.enabled=${WHATSAPP_ENABLED:true}
whatsapp.callmebot.base-url=https://api.callmebot.com/whatsapp.php

# Verificacao periodica de SLA (em milissegundos) e escalonamento automatico
sla.scheduler.intervalo-ms=60000
sla.escalonamento-automatico=true
